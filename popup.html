<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Gemini Counter</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --surface: #ffffff;
      --surface-strong: #f9fafb;
      --ink: #111827;
      --muted: #6b7280;
      --subtle: #8a94a6;
      --line: #e5e7eb;
      --line-strong: #d4dae3;
      --brand: #2563eb;
      --brand-strong: #1d4ed8;
      --brand-soft: #dbeafe;
      --success: #16a34a;
      --warning: #d97706;
      --danger: #dc2626;
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      --shadow-soft: 0 1px 2px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: #eef2f7;
    }

    body {
      width: 380px;
      min-height: 100vh;
      font-family: Aptos, 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 0;
      margin: 0;
      background:
        linear-gradient(180deg, #fbfdff 0%, var(--bg) 42%, #eef2f7 100%);
      color: var(--ink);
      font-size: 13px;
      line-height: 1.45;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(255, 255, 255, 0.92);
      padding: 14px 16px;
      border-bottom: 1px solid rgba(212, 218, 227, 0.78);
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(16px);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 7px;
      flex: 0 0 auto;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-logo {
      flex: 0 0 auto;
      width: 24px;
      height: 24px;
      filter: drop-shadow(0 5px 10px rgba(37, 99, 235, 0.20));
    }

    h2 {
      margin: 0;
      font-size: 15px;
      letter-spacing: 0;
      color: var(--ink);
      line-height: 1.15;
    }

    .brand-subtitle {
      margin-top: 2px;
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
    }

    .version-pill {
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      background: #fff;
      font-size: 10px;
      line-height: 1;
      padding: 5px 7px;
    }

    .content {
      padding: 14px 14px 0;
    }

    .content:last-of-type {
      padding-bottom: 18px;
    }

    .section-label {
      margin: 2px 2px 9px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .stack {
      display: grid;
      gap: 10px;
    }

    .model-card {
      position: relative;
      overflow: hidden;
      background: var(--surface);
      border-radius: 8px;
      box-shadow: var(--shadow-soft);
      padding: 13px;
      border: 1px solid var(--line);
      transition: border-color 0.18s ease, box-shadow 0.18s ease, transform 0.18s ease;
    }

    .model-card:hover {
      border-color: #cbd5e1;
      box-shadow: var(--shadow);
      transform: translateY(-1px);
    }

    .model-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 10px;
    }

    .model-name {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 14px;
      color: var(--ink);
    }

    .model-name::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--success);
      box-shadow: 0 0 0 4px rgba(22, 163, 74, 0.10);
    }

    .count-display {
      color: var(--brand);
      font-size: 18px;
      font-weight: 750;
      letter-spacing: 0;
      line-height: 1;
      white-space: nowrap;
    }

    .limit-warning {
      color: var(--warning);
    }

    .limit-reached {
      color: var(--danger);
    }

    .model-card:has(.limit-warning) .model-name::before {
      background: var(--warning);
      box-shadow: 0 0 0 4px rgba(217, 119, 6, 0.12);
    }

    .model-card:has(.limit-reached) .model-name::before {
      background: var(--danger);
      box-shadow: 0 0 0 4px rgba(220, 38, 38, 0.12);
    }

    .progress-bar {
      position: relative;
      height: 8px;
      box-sizing: border-box;
      background: #edf1f6;
      border: 1px solid #dce3ec;
      border-radius: 999px;
      margin: 0 0 10px;
      padding: 1px;
      overflow: hidden;
      box-shadow: inset 0 1px 2px rgba(15, 23, 42, 0.10);
    }

    .progress-fill {
      position: relative;
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--brand-strong), #38bdf8);
      box-shadow: 0 0 12px rgba(37, 99, 235, 0.26);
      transition: width 0.35s ease, background 0.2s ease;
    }

    .progress-fill::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.42), rgba(255, 255, 255, 0));
      border-radius: inherit;
    }

    .progress-fill.warning {
      background: linear-gradient(90deg, var(--warning), #facc15);
      box-shadow: 0 0 12px rgba(217, 119, 6, 0.24);
    }

    .progress-fill.danger {
      background: linear-gradient(90deg, var(--danger), #fb7185);
      box-shadow: 0 0 12px rgba(220, 38, 38, 0.24);
    }

    .meta-info {
      font-size: 11px;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .timer-text {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .settings-panel {
      margin-top: 12px;
      padding: 11px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface-strong);
      display: none;
    }

    .settings-panel.active {
      display: grid;
      gap: 9px;
    }

    .settings-divider {
      height: 1px;
      background: var(--line);
      margin: 2px 0;
    }

    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .setting-row label {
      flex: 1;
      font-size: 12px;
      color: var(--muted);
    }

    .setting-row input {
      width: 76px;
      padding: 7px 8px;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      font-size: 12px;
      color: var(--ink);
      background: #fff;
      outline: none;
    }

    .setting-row input:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .calibration-toggle {
      width: 100%;
      color: var(--brand);
      border-color: #bfdbfe;
      background: #eff6ff;
    }

    .calibration-toggle:hover {
      background: #dbeafe;
      border-color: #93c5fd;
    }

    .calibration-panel {
      display: none;
      gap: 9px;
      padding: 11px;
      border-radius: 8px;
      border: 1px solid #bfdbfe;
      background: #f8fbff;
    }

    .calibration-panel.active {
      display: grid;
    }

    .calibration-note {
      margin: 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.45;
    }

    .calibration-warning {
      margin: 0;
      padding: 9px 10px;
      border-radius: 7px;
      background: #fff7ed;
      border: 1px solid #fed7aa;
      color: #9a3412;
      font-size: 11px;
      line-height: 1.45;
    }

    .calibration-panel .setting-row {
      align-items: flex-start;
    }

    .calibration-panel .setting-row label {
      padding-top: 7px;
    }

    .calibration-panel input[type="datetime-local"] {
      width: 170px;
    }

    .calibration-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .calibration-apply {
      background: var(--brand);
      border-color: var(--brand);
      color: #fff;
    }

    .calibration-apply:hover {
      background: var(--brand-strong);
      border-color: var(--brand-strong);
    }

    .calibration-message {
      display: none;
      margin: 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.4;
    }

    .calibration-message.active {
      display: block;
    }

    .calibration-message.error {
      color: var(--danger);
    }

    .actions {
      text-align: right;
      margin-top: 5px;
    }

    button {
      border: 1px solid var(--line);
      padding: 7px 10px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 650;
      background: #fff;
      color: var(--ink);
      transition: background 0.16s ease, border-color 0.16s ease, color 0.16s ease, transform 0.16s ease;
    }

    button:hover {
      background: #f8fafc;
      border-color: #cbd5e1;
      transform: translateY(-1px);
    }

    button:focus-visible,
    .toggle-settings:focus-visible,
    input:focus-visible {
      outline: 2px solid rgba(37, 99, 235, 0.35);
      outline-offset: 2px;
    }

    button.primary {
      background: var(--ink);
      border-color: var(--ink);
      color: white;
    }

    button.primary:hover {
      background: #253044;
      border-color: #253044;
    }

    .toggle-settings {
      color: var(--brand);
      cursor: pointer;
      font-size: 11px;
      font-weight: 700;
      text-decoration: none;
      background: none;
      border: none;
      padding: 0;
      white-space: nowrap;
    }

    .empty-state {
      text-align: center;
      padding: 28px 18px;
      color: var(--muted);
      background: var(--surface);
      border: 1px dashed var(--line-strong);
      border-radius: 8px;
    }

    .delete-btn {
      background: #fff;
      color: var(--danger);
      border: 1px solid #fecaca;
      width: 100%;
      padding: 8px;
    }

    .delete-btn:hover {
      background: #fff1f2;
      border-color: #fca5a5;
    }

    .panel-card {
      background: var(--surface);
      border-radius: 8px;
      box-shadow: var(--shadow-soft);
      border: 1px solid var(--line);
      padding: 13px;
    }

    .panel-title {
      font-size: 13px;
      font-weight: 750;
      margin-bottom: 8px;
      color: var(--ink);
    }

    .panel-help {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.4;
      margin-top: 8px;
    }

    .feature-toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 12px;
      color: var(--ink);
      cursor: pointer;
    }

    .feature-copy {
      min-width: 0;
      display: grid;
      gap: 2px;
    }

    .feature-copy strong {
      font-size: 12px;
      font-weight: 650;
    }

    .feature-copy span {
      color: var(--muted);
      font-size: 11px;
    }

    .feature-toggle-row input[type="checkbox"] {
      position: relative;
      flex: 0 0 auto;
      appearance: none;
      width: 38px;
      height: 22px;
      margin: 0;
      border: 1px solid #cbd5e1;
      border-radius: 999px;
      background: #e5e7eb;
      cursor: pointer;
      transition: background 0.18s ease, border-color 0.18s ease;
    }

    .feature-toggle-row input[type="checkbox"]::after {
      content: "";
      position: absolute;
      width: 16px;
      height: 16px;
      left: 2px;
      top: 2px;
      border-radius: 999px;
      background: #fff;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.25);
      transition: transform 0.18s ease;
    }

    .feature-toggle-row input[type="checkbox"]:checked {
      background: var(--brand);
      border-color: var(--brand);
    }

    .feature-toggle-row input[type="checkbox"]:checked::after {
      transform: translateX(16px);
    }

    .footer-actions {
      border-top: 1px solid var(--line);
      margin-top: 14px;
      padding-top: 12px;
      padding-bottom: 2px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .community-links {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .community-link {
      width: 30px;
      height: 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--line);
      border-radius: 7px;
      color: var(--muted);
      background: #fff;
      text-decoration: none;
      transition: background 0.16s ease, border-color 0.16s ease, color 0.16s ease, transform 0.16s ease;
    }

    .community-link:hover {
      background: #f8fafc;
      border-color: #cbd5e1;
      color: var(--ink);
      transform: translateY(-1px);
    }

    .community-link:focus-visible {
      outline: 2px solid rgba(37, 99, 235, 0.35);
      outline-offset: 2px;
    }

    .community-link svg {
      width: 17px;
      height: 17px;
      display: block;
    }

    #reset-all-btn {
      color: var(--danger);
      border-color: #fecaca;
    }

    #reset-all-btn:hover {
      background: #fff1f2;
      border-color: #fca5a5;
    }

    .confirm-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      background: rgba(15, 23, 42, 0.46);
      backdrop-filter: blur(4px);
      padding: 18px;
    }

    .confirm-dialog {
      width: 100%;
      max-width: 280px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 24px 60px rgba(15, 23, 42, 0.24);
    }

    .confirm-dialog p {
      margin: 0 0 14px;
      font-size: 13px;
      color: var(--ink);
      line-height: 1.45;
    }

    .confirm-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }

    .danger-action {
      background: var(--danger);
      border-color: var(--danger);
      color: #fff;
    }

    .danger-action:hover {
      background: #b91c1c;
      border-color: #b91c1c;
    }
  </style>
</head>

<body>
  <header>
    <div class="brand">
      <svg class="brand-logo" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
        <defs>
          <linearGradient id="gemini-logo-gradient" x1="4" y1="28" x2="28" y2="4" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#34a853" />
            <stop offset="0.38" stop-color="#4285f4" />
            <stop offset="0.72" stop-color="#a142f4" />
            <stop offset="1" stop-color="#fbbc04" />
          </linearGradient>
        </defs>

      </svg>
      <div>
        <h2>Gemini Power Tools</h2>
        <div class="brand-subtitle">Usage limits and writing tools</div>
      </div>
    </div>
    <div class="header-actions">
      <button id="open-stats-btn" class="primary">Statistics</button>
      <div class="version-pill">v1.7</div>
    </div>
  </header>

  <div class="content" id="stats-container">
    <!-- Cards injected here -->
  </div>

  <div class="content">
    <div class="section-label">Tools</div>
    <div class="stack">
    <div class="panel-card">
      <div class="panel-title">Composer</div>
      <label class="feature-toggle-row" for="auto-dir-toggle">
        <span class="feature-copy">
          <strong>Auto direction</strong>
          <span>RTL languages and English lines</span>
        </span>
        <input id="auto-dir-toggle" type="checkbox">
      </label>
    </div>

    <div class="panel-card">
      <div class="panel-title">Math Colors</div>
      <label class="feature-toggle-row" for="neon-math-toggle">
        <span class="feature-copy">
          <strong>Readable math colors</strong>
          <span>Better contrast for Gemini and KaTeX</span>
        </span>
        <input id="neon-math-toggle" type="checkbox">
      </label>
    </div>
    </div>
  </div>

  <div class="content">
    <div class="footer-actions">
      <div class="community-links" aria-label="Community links">
        <a class="community-link" href="https://discord.gg/AXPE7gUq" target="_blank" rel="noopener noreferrer" aria-label="Join Discord community" title="Discord">

          </svg>
        </a>
        <a class="community-link" href="#" target="_blank" rel="noopener noreferrer" aria-label="Open GitHub community" title="GitHub">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">

          </svg>
        </a>
      </div>
      <button id="reset-all-btn">Reset All Data</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>

</html>
