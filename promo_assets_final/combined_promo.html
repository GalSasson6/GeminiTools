<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Power Tools Combined</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: rgb(10, 15, 32);
            --text-main: #ffffff;
            --text-muted: #a0a5b5;
            --accent-blue: #4e73df;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1280px;
            height: 800px;
            background: 
                repeating-linear-gradient(
                    45deg,
                    rgba(255, 255, 255, 0.05) 0px,
                    rgba(255, 255, 255, 0.05) 1px,
                    transparent 1px,
                    transparent 30px
                ),
                linear-gradient(135deg, rgb(10, 15, 32) 0%, rgb(27, 36, 79) 100%);
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
            position: relative;
            overflow: hidden;
            padding: 40px;
            display: flex;
            flex-direction: column;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
        }

        .logo-img {
            width: 60px;
            height: 60px;
        }

        .title {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .content {
            display: flex;
            flex-grow: 1;
            gap: 60px;
            align-items: center;
            justify-content: center;
        }

        .feature-box {
            display: flex;
            flex-direction: column;
            gap: 16px;
            flex: 1;
        }

        .img-container {
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .feature-img {
            max-width: 100%;
            max-height: 450px;
            border-radius: 12px;
            object-fit: contain;
        }

        .stats-img {
            max-height: 480px;
        }

        .explainer {
            background: rgba(255, 255, 255, 0.05);
            padding: 24px;
            border-radius: 16px;
            border-left: 4px solid var(--accent-blue);
        }

        h3 {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        p {
            font-size: 16px;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .stats-col {
            flex: 2;
        }
    </style>
</head>
<body>

    <div class="header">
        <img src="../icons/icon128.png" alt="Logo" class="logo-img">
        <h1 class="title">Gemini Power Tools</h1>
    </div>

    <div class="content">
        <!-- Feature 1: Popup -->
        <div class="feature-box">
            <div class="img-container">
                <img src="popup_cropped.png" alt="Popup Interface" class="feature-img">
            </div>
            <div class="explainer">
                <h3>Smart Controls</h3>
                <p>Instantly check model limits, toggle RTL support, and optimize LaTeX colors directly from the extension popup.</p>
            </div>
        </div>

        <!-- Feature 2: Stats -->
        <div class="feature-box stats-col">
            <div class="img-container">
                <img src="stats_cropped.png" alt="Usage Statistics" class="feature-img stats-img">
            </div>
            <div class="explainer">
                <h3>Usage Analytics</h3>
                <p>Dive into detailed history and trends. Track your model interactions across the last 7 days with interactive charts.</p>
            </div>
        </div>
    </div>

</body>
</html>
